name: Publish price-action radar

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Check engine access
        id: engine
        shell: bash
        env:
          ENGINE_DEPLOY_KEY: ${{ secrets.ENGINE_DEPLOY_KEY }}
        run: |
          if [ -n "$ENGINE_DEPLOY_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private analysis engine
        if: steps.engine.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ITyongzhen/aijiaoyi-engine
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine
          persist-credentials: false

      - name: Set up Python
        if: steps.engine.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install analysis engine
        if: steps.engine.outputs.enabled == 'true'
        run: python -m pip install --disable-pip-version-check -e ./engine

      - name: Generate public snapshot
        if: steps.engine.outputs.enabled == 'true'
        run: python engine/scripts/export_dashboard_snapshot.py --output "$GITHUB_WORKSPACE/site"
        env:
          AIJIAOYI_PROJECT_ROOT: ${{ github.workspace }}/engine
          OBSERVATION_TOP_N: "30"
          OBSERVATION_TIMEFRAMES: "15m,1h,4h"
          USE_LLM_INTENT: "false"
          USE_LLM_NARRATIVE: "false"
          PAPER_TRADING_ENABLED: "false"
          STRATEGY_V1_PAPER_ENABLED: "false"

      - name: Reject private artifacts
        shell: bash
        run: |
          if find site -type f \( -name '.env' -o -name '*.db' -o -name '*.sqlite*' -o -name '*.zip' \) | grep -q .; then
            echo "Private artifact detected; refusing to publish."
            exit 1
          fi
          if grep -RIlE 'TELEGRAM_BOT_TOKEN|DEEPSEEK_API_KEY|TG_OWNER_USER_ID' site; then
            echo "Secret-like configuration detected; refusing to publish."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
